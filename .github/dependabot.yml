version: 2

# Grouping policy (same for every ecosystem):
#   - version updates, minor + patch: one grouped PR per ecosystem
#   - version updates, major: not grouped on purpose -> one PR per dependency,
#     so a breaking major doesn't hold up the rest (a grouped major PR is
#     all-or-nothing)
#   - security updates: their own grouped PR; security updates ignore the
#     version-update groups, so without these they open one PR per advisory
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      nuget-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Provider constraints and .terraform.lock.hcl of the Terraform code.
  # infra/live/** are Terragrunt units (terragrunt.hcl + lockfile only), which
  # the terraform ecosystem doesn't read: only the directories with .tf files
  # are listed (modules/*, stack). Terragrunt units keep their own copy of the
  # lockfile (live/platform/vercel mirrors modules/vercel), so when Dependabot
  # bumps a module lockfile, copy it over to the matching live/ unit.
  - package-ecosystem: "terraform"
    directories:
      - "/infra/modules/*"
      - "/infra/stack"
    schedule:
      interval: "weekly"
    groups:
      terraform-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      terraform-security:
        applies-to: security-updates
        patterns:
          - "*"
