name: deploy-backend

# Deploys the .NET backend to Azure App Service. The frontend continues to
# deploy to Vercel on its own (Vercel's Git integration), and vercel.json
# rewrites /api/* here — so the browser only ever sees the Vercel origin and
# the auth cookie stays same-origin.
#
# Auth is OIDC (azure/login federated credential, no stored secret). The
# app registration, its role assignment, the Production GitHub Environment,
# and these vars are all provisioned by infra/terraform/ci.tf — see
# infra/terraform/README.md#cicd. Nothing here is set by hand.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Published self-contained so the deploy doesn't depend on App Service
      # having a .NET 10 runtime available (it's still Preview-tagged in some
      # regions). The startup command is set once by Terraform — see
      # infra/azure.md.
      - name: Publish
        working-directory: backend
        run: |
          dotnet publish ComeRico.Api/ComeRico.Api.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o publish

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: backend/publish
