name: deploy-backend

# Deploys the .NET backend to AWS Lambda (managed dotnet10 runtime, zip
# package, no container/ECR). The frontend continues to deploy to Vercel
# on its own (Vercel's Git integration), and vercel.json rewrites /api/*
# here — so the browser only ever sees the Vercel origin and the auth
# cookie stays same-origin.
#
# Auth to AWS is OIDC (aws-actions/configure-aws-credentials, no stored
# secret) — one IAM role per environment, shared OIDC provider across both
# (job `environment:` below selects which environment's vars apply). All
# of this — the OIDC provider, both GitHub Environments, these vars, and
# the Lambda function itself — is provisioned by infra/stack/ci.tf and
# infra/modules/aws_oidc — see infra/stack/README.md#cicd. Nothing here is
# set by hand.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [Development, Production]
        default: Development

permissions:
  id-token: write
  contents: read

jobs:
  # Computes which GitHub Environment this run targets exactly once — the
  # `environment:` job attribute and top-level `concurrency:` block can
  # each only see `github`/`inputs` context (not a shared `env`), so
  # without this every consumer would repeat the same three-way ternary.
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.resolve.outputs.name }}
    steps:
      - id: resolve
        run: echo "name=${{ github.event_name == 'release' && 'Production' || (github.event_name == 'workflow_dispatch' && inputs.environment || 'Development') }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy (${{ needs.resolve-environment.outputs.name }})
    needs: resolve-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.name }}

    # One in-flight deploy per environment — a second push (or a manual
    # dispatch racing an automatic one) cancels the older run instead of
    # letting two `aws lambda update-function-code` calls land on the same
    # function at once.
    concurrency:
      group: deploy-backend-${{ needs.resolve-environment.outputs.name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # linux-arm64 to match the function's arm64 architecture
      # (infra/stack/lambda.tf). InformationalVersion carries the commit
      # SHA into the built assembly so a Production incident can be traced
      # back to what's actually deployed. OpenApiGenerateDocuments=false:
      # that target runs the just-built assembly in-process to generate
      # ComeRico.Api.json, which fails cross-arch (arm64 output loaded by
      # the x64 runner) — the doc isn't needed for a deploy anyway.
      - name: Publish
        working-directory: backend
        run: |
          dotnet publish ComeRico.Api/ComeRico.Api.csproj \
            -c Release \
            -r linux-arm64 \
            --self-contained false \
            -p:InformationalVersion=${{ github.sha }} \
            -p:OpenApiGenerateDocuments=false \
            -o publish

      - name: Zip package
        working-directory: backend/publish
        run: zip -r ../function.zip .

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to Lambda
        working-directory: backend
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.AWS_LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://function.zip \
            --no-cli-pager
