name: deploy-backend

# Deploys the .NET backend, containerized, to Azure Container Apps. The
# frontend continues to deploy to Vercel on its own (Vercel's Git
# integration), and vercel.json rewrites /api/* here — so the browser only
# ever sees the Vercel origin and the auth cookie stays same-origin.
#
# Image is built and pushed to GitHub Container Registry (ghcr.io) — free,
# no Azure Container Registry needed. Pushes to main deploy Development;
# publishing a GitHub Release deploys Production. Auth to Azure is OIDC
# (azure/login federated credential, no stored secret) — one identity
# shared across both environments, but a separate federated
# credential/role assignment/GitHub Environment per environment (job
# `environment:` below selects which one's vars/secrets apply). All of
# this — the shared identity, both GitHub Environments, these vars, and
# the Container App itself — is provisioned by infra/stack/ci.tf and
# infra/modules/github_actions_ci — see infra/stack/README.md#cicd.
# Nothing here is set by hand.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [Development, Production]
        default: Development

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'Production' || (github.event_name == 'workflow_dispatch' && inputs.environment || 'Development') }}

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Builds backend/Dockerfile, pushes it to ghcr.io (already
      # authenticated above), and points the Container App at the new
      # image (az containerapp update under the hood) — all in one step.
      # InformationalVersion carries the commit SHA into the built
      # assembly so a Production incident can be traced back to what's
      # actually deployed.
      - uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: backend
          dockerfilePath: Dockerfile
          imageToBuild: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          buildArguments: INFORMATIONAL_VERSION=${{ github.sha }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}

      - name: logout
        if: always()
        run: |
          az logout
