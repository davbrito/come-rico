name: deploy-backend

# Deploys the .NET backend to Azure App Service. The frontend continues to
# deploy to Vercel on its own (Vercel's Git integration), and vercel.json
# rewrites /api/* here — so the browser only ever sees the Vercel origin and
# the auth cookie stays same-origin.
#
# Auth is OIDC (azure/login federated credential, no stored secret). The
# app registration, its role assignment, the Production GitHub Environment,
# and these vars are all provisioned by infra/stack/ci.tf — see
# infra/stack/README.md#cicd. Nothing here is set by hand.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Framework-dependent — the App Service plan pins the .NET 10 runtime
      # via site_config.application_stack in infra/stack/main.tf, so the
      # deploy doesn't need to carry its own. The startup command
      # ("dotnet ComeRico.Api.dll", not the apphost binary — zip deploys
      # don't reliably preserve its executable bit) is set once by
      # Terraform — see infra/azure.md.
      - name: Publish
        working-directory: backend
        run: |
          dotnet publish ComeRico.Api/ComeRico.Api.csproj \
            -c Release \
            -r linux-x64 \
            -o publish

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: backend/publish

      - name: logout
        run: |
          az logout
