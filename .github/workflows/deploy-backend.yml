name: deploy-backend

# Deploys the .NET backend to Azure App Service. The frontend continues to
# deploy to Vercel on its own (Vercel's Git integration), and vercel.json
# rewrites /api/* here — so the browser only ever sees the Vercel origin and
# the auth cookie stays same-origin.
#
# Pushes to main deploy Development; publishing a GitHub Release deploys
# Production. Auth is OIDC (azure/login federated credential, no stored
# secret) — one identity shared across both environments, but a separate
# federated credential/role assignment/GitHub Environment per environment
# (job `environment:` below selects which one's vars/secrets apply). All
# of this — the shared identity, both GitHub Environments, and these vars
# — is provisioned by infra/stack/ci.tf and infra/modules/github_actions_ci
# — see infra/stack/README.md#cicd. Nothing here is set by hand.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [Development, Production]
        default: Development

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'Production' || (github.event_name == 'workflow_dispatch' && inputs.environment || 'Development') }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Framework-dependent — the App Service plan pins the .NET 10 runtime
      # via site_config.application_stack in infra/stack/main.tf, so the
      # deploy doesn't need to carry its own. The startup command
      # ("dotnet ComeRico.Api.dll", not the apphost binary — zip deploys
      # don't reliably preserve its executable bit) is set once by
      # Terraform — see infra/azure.md.
      # InformationalVersion carries the commit SHA into the built assembly
      # so a Production incident can be traced back to what's actually
      # deployed (App Service's Kudu shows the zip contents, not git).
      - name: Publish
        working-directory: backend
        run: |
          dotnet publish ComeRico.Api/ComeRico.Api.csproj \
            -c Release \
            -r linux-x64 \
            -o publish \
            -p:InformationalVersion=${{ github.sha }}

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: backend/publish

      - name: logout
        if: always()
        run: |
          az logout
