name: deploy-backend

# Deploys the .NET backend to Azure App Service. The frontend continues to
# deploy to Vercel on its own (Vercel's Git integration), and vercel.json
# rewrites /api/* here — so the browser only ever sees the Vercel origin and
# the auth cookie stays same-origin.
#
# Requires (see infra/azure.md):
#   secrets.AZURE_WEBAPP_PUBLISH_PROFILE  — Get publish profile from the App Service
#   vars.AZURE_WEBAPP_NAME                — the App Service name
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Published self-contained so the deploy doesn't depend on App Service
      # having a .NET 10 runtime available (it's still Preview-tagged in some
      # regions). The startup command is set once at app-creation time — see
      # infra/azure.md.
      - name: Publish
        working-directory: backend
        run: |
          dotnet publish ComeRico.Api/ComeRico.Api.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend/publish
