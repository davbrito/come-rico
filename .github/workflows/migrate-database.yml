name: migrate-database

# Manually-dispatched: applies pending EF Core migrations to the database
# configured in the target GitHub Environment's ConnectionStrings__DefaultConnection
# secret — named to match the config key the app (and `dotnet ef`, which
# bootstraps via the same Program.cs) actually reads; a DATABASE_URL env
# var is not understood anywhere in the codebase. Migrations are never
# applied automatically by the app itself — this workflow (run via the
# dotnet CLI) is the only supported way to apply them outside a
# developer's machine.
on:
  # Called by release.yml before the Production backend deploy.
  workflow_call:
    inputs:
      environment:
        description: Environment to migrate
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to migrate
        type: choice
        options: [Development, Production]
        default: Development

jobs:
  # workflow_call inputs can't be `choice`, so check the name before any job
  # uses it as `environment:` — an unknown one would make GitHub create an
  # empty environment (no secrets, no reviewers) instead of failing.
  validate:
    runs-on: ubuntu-latest
    steps:
      - env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$ENVIRONMENT" in
            Development|Production) ;;
            *) echo "::error::Unknown environment '$ENVIRONMENT' (expected Development or Production)."; exit 1 ;;
          esac

  migrate:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: backend
        run: dotnet restore ComeRico.Api/ComeRico.Api.csproj

      # dotnet-tools.json pins dotnet-ef for the repo — the SDK resolves
      # `dotnet ef` against this local manifest (not a --global install)
      # once one is present, so it has to actually be restored.
      - name: Install dotnet-ef
        working-directory: backend
        run: dotnet tool restore

      - name: List pending migrations
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.ConnectionStrings__DefaultConnection }}
        run: ./ef list

      - name: Apply migrations
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.ConnectionStrings__DefaultConnection }}
        run: ./ef update
