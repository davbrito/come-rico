name: migrate-database

# Manually-dispatched: applies pending EF Core migrations to the database
# configured in the DATABASE_URL secret (Production environment). Migrations
# are never applied automatically by the app itself — this workflow (run via
# the dotnet CLI) is the only supported way to apply them outside a
# developer's machine.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: backend
        run: dotnet restore ComeRico.Api/ComeRico.Api.csproj

      # dotnet-tools.json pins dotnet-ef for the repo — the SDK resolves
      # `dotnet ef` against this local manifest (not a --global install)
      # once one is present, so it has to actually be restored.
      - name: Install dotnet-ef
        working-directory: backend
        run: dotnet tool restore

      - name: List pending migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./ef list

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./ef update
