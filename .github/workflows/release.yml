name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tags aren't covered by test.yml's own triggers (push-to-main, PRs),
      # so nothing otherwise stops a tag on a red or unbuilt commit from
      # cutting a release and dispatching a Production deploy. Require the
      # tagged commit's checks to have already passed on main first.
      - name: Verify tagged commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
            --jq '[.check_runs[] | select(.name != "release")] | if length == 0 then "missing" elif all(.conclusion == "success") then "success" else "failure" end')

          if [ "$status" != "success" ]; then
            echo "::error::Tagged commit ${{ github.sha }} has no successful CI checks (status: $status) — refusing to release."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

      # The GITHUB_TOKEN release above can't itself trigger deploy-backend's
      # `on: release` event (Actions blocks the default token from cascading
      # into other workflows), so dispatch it explicitly — on the tag, so the
      # backend deployed is the released commit and not whatever main has now.
      - name: Deploy backend to Production
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy-backend.yml --ref "$TAG" -f environment=Production

          # `gh workflow run` doesn't return the run id: find the run it created.
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow deploy-backend.yml --event workflow_dispatch --limit 20 \
              --json databaseId,headBranch,createdAt \
              --jq "[.[] | select(.headBranch == \"$TAG\" and .createdAt >= \"$started\")][0].databaseId // empty")
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::Couldn't find the deploy-backend run dispatched for $TAG."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # The frontend's Production is the Vercel deployment of the `production`
      # branch (Vercel → Settings → Git → Production Branch); every push to main
      # is only a Preview, wired to the Development backend. Move `production`
      # to the released commit only once its backend is live, so the
      # production frontend never calls endpoints its backend doesn't have yet.
      - name: Wait for the backend deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch "${{ steps.backend.outputs.run_id }}" --exit-status --interval 15

      - name: Release frontend (move the production branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/refs/heads/production" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/production" \
              -f sha="${{ github.sha }}" -F force=true
          else
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref=refs/heads/production -f sha="${{ github.sha }}"
          fi
