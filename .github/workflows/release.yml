name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

      # The GITHUB_TOKEN release above can't itself trigger deploy-backend's
      # `on: release` event (Actions blocks the default token from cascading
      # into other workflows), so dispatch it explicitly.
      - name: Deploy to Production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-backend.yml -f environment=Production
